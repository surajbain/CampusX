services:
  postgres:
    image: postgres:16-alpine
    container_name: campusx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusx
      POSTGRES_PASSWORD: campusx_dev_password
      POSTGRES_DB: campusx
    ports:
      - "5432:5432"
    volumes:
      - campusx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusx -d campusx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - campusx_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
        context: ./backend
        dockerfile: Dockerfile
    container_name: campusx-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_ADDR: redis:6379
      RUN_MIGRATIONS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  campusx_pgdata:
  campusx_redisdata: